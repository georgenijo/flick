[package]
name = "flick"
version = "0.1.0"
edition = "2024"
description = "A lean ⌥Tab window switcher for macOS"
license = "MIT"
repository = "https://github.com/georgenijo/flick"
readme = "README.md"
keywords = ["macos", "window-switcher", "alt-tab", "appkit"]
categories = ["gui"]
publish = false

[dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build Flick.app
        run: ./build.sh
      - name: Smoke test
        run: test -x Flick.app/Contents/MacOS/flick && codesign --verify Flick.app
      - name: Type-check test tools
        run: for f in tests/*.swift; do swiftc -typecheck "$f"; done
